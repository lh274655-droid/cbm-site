name: Enviar Logs Firebase -> Discord

on:
  schedule:
    - cron: "*/2 * * * *" # a cada 2 minutos
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repo
        uses: actions/checkout@v3

      - name: Instalar Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Instalar dependências
        run: npm install firebase-admin node-fetch

      - name: Rodar script
        run: node index.js
